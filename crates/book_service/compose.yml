services:
  app:
    image: book-service-app
    env_file: .env
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        workspace_root: ../..
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3000"
    command: [ "sh", "-c", "/service/migration migration apply && /service/app" ]
    restart: always

  db:
    image: postgres:18-alpine
    container_name: book-service-db
    environment:
      POSTGRES_DB: book-service-db
      POSTGRES_USER: book-service-user
      POSTGRES_PASSWORD: book-service-pass
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U book-service-user -d book-service-db" ]
      interval: 3s
      timeout: 5s
      retries: 5
    restart: always